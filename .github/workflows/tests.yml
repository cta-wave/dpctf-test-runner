name: tests

on:
  push:
    branches: [staging]
  pull_request:

jobs:
  wave-tests:
    name: test suite (tools/wave)
    # ubuntu-22.04: the runner image must still provide Python 3.9
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov
          python -m pip install "attrs==22.2.0" "hypothesis==6.68.0"
          python -m pip install "ua-parser==0.8.0" "python-dateutil==2.8.1" six requests
          # Pre-import hypothesis before pytest loads conftest.py: the repo
          # root inserts vendored attrs 18.1 (no `eq` param) onto sys.path,
          # which breaks hypothesis's import.
          SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          echo "import hypothesis" > "$SITE/zz_preimport_hypothesis.py.pth"

      - name: Run test suite
        working-directory: tools
        run: |
          # test_api.py and test_wave.py boot the real server and need a
          # warm MANIFEST.json / a server on port 8000; they are exercised
          # manually (see PR notes) and wired into CI as follow-up work.
          python -m pytest wave/tests \
            --ignore=wave/tests/test_api.py \
            --ignore=wave/tests/test_wave.py \
            --cov=wave --cov-report=term
